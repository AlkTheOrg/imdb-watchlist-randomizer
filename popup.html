<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMDB Randomized Popup Page</title>
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand">
      <img
        src="./images/icon-128x128.png"
        width="44"
        height="32"
        alt="IMDb Watchlist Randomizer"
        class="m-0"
      />
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item active">
            <a
              class="nav-link"
              target="_blank"
              href="https://github.com/AlkTheOrg/imdb-watchlist-randomizer/blob/main/ABOUT.md#about-the-extension"
            >
              About
            </a>
          </li>
          <li class="nav-item">
            <a
              id="githubHref"
              class="nav-link"
              href="https://github.com/AlkTheOrg/imdb-watchlist-randomizer"
              target="_blank"
            >
              <img
                width="24"
                src="./images/GitHub-Mark-32px.png"
                alt="GitHub"
              />
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <form class="p-2 mt-2">
      <div class="form-row m-0">
        <div class="col-md-6 mb-3 ml-auto mr-4" style="width: auto">
          <label for="minIMDBRating">Min IMDB Rating:</label>
          <select class="form-control form-control-sm" id="minIMDBRating">
            <option value="1" selected>All</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
          </select>
        </div>
        <div class="col-md-6 mb-3 mr-auto ml-4" style="width: auto">
          <label for="multimediaType">Multimedia Type:</label>
          <select class="form-control form-control-sm" id="multimediaType">
            <option value="movie" selected>Movies Only</option>
            <option value="series">TV Series Only</option>
            <option value="all">All</option>
          </select>
        </div>
      </div>

      <div class="d-flex justify-content-around">
        <div class="form-check form-check-inline">
          <input
            checked
            class="form-check-input"
            type="checkbox"
            id="showRatings"
          />
          <label class="form-check-label" for="showRatings">Ratings</label>
        </div>
        <div class="form-check form-check-inline">
          <input
            checked
            class="form-check-input"
            type="checkbox"
            id="showPoster"
          />
          <label class="form-check-label" for="showPoster">Poster</label>
        </div>
        <div class="form-check form-check-inline">
          <input
            checked
            class="form-check-input"
            type="checkbox"
            id="showPlot"
          />
          <label class="form-check-label" for="showPlot">Plot</label>
        </div>
        <div class="form-check form-check-inline d-none">
          <input
            checked
            class="form-check-input"
            type="checkbox"
            id="showGenres"
          />
          <label class="form-check-label" for="showGenres">Genres</label>
        </div>
        <div class="form-check form-check-inline">
          <input
            checked
            class="form-check-input"
            type="checkbox"
            id="showCredits"
          />
          <label class="form-check-label" for="showCredits">Credits</label>
        </div>
      </div>

      <div class="container text-center">
        <div class="btn-group randomize-btns" role="group">
          <button
            type="button"
            id="scanAndRandomize"
            class="btn btn-outline-danger btn-sm"
          >
            SCAN & RANDOMIZE
          </button>
          <button
            disabled
            id="randomizeFromSync"
            type="button"
            class="btn text-white btn-sm ml-2 cool-orange"
          >
            RANDOMIZE
          </button>
        </div>
      </div>
    </form>

    <div id="infoOutputDiv" class="text-center px-2"></div>

    <div class="border-top border-black mt-1 mb-3" id="results"></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
